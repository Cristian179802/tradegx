name: Exchange sync cron

# Sincronizează conturile de bursă (Binance, Bybit) la ~5 minute.
# Necesită secretul CRON_SECRET în GitHub (Settings → Secrets → Actions),
# cu ACEEAȘI valoare ca variabila CRON_SECRET de pe Vercel.
#
# De ce 5 și nu 1: programările GitHub Actions au granularitate de ~5 minute și
# întârzie des sub încărcare, deci „la un minut" ar fi o promisiune pe care
# unealta n-o ține. Iar Binance dă 6000 de puncte pe minut per IP, pe același IP
# cu fluxul de prețuri live al aplicației — un ban temporar de la ei ar lăsa toți
# utilizatorii fără prețuri, nu doar pe cel care sincroniza.
#
# Ruta e mărginită singură: verifică maxim 40 de conturi per rulare și sare peste
# cele fără activitate (~25 de puncte ca să afli, față de ~485 pentru un import),
# deci costul nu crește cu numărul de utilizatori.

on:
  # ── PROGRAMAREA E OPRITĂ INTENȚIONAT ────────────────────────────────────────
  #
  # Nu din cauza GitHub, ci a bazei de date. Neon suspendă computul după 5 minute
  # fără interogări, iar planul gratuit dă 100 CU-ore pe lună. Un cron la 5 minute
  # ține baza trează 100% din timp: 0,25 CU × 720 ore = 180 CU-ore, adică de 1,8
  # ori toată alocația lunară — doar el, fără niciun utilizator.
  #
  # Pe 26 august alocația s-a epuizat și Neon a anunțat că interogările pot începe
  # să eșueze. Pornit acum, cron-ul ar fi accelerat exact asta.
  #
  # Sincronizarea NU e moartă între timp: se face la deschiderea aplicației și la
  # revenirea în tab, prin sesiunea utilizatorului (vezi /api/accounts/refresh),
  # plus butonul din pagina Conturi.
  #
  # CA SĂ O PORNEȘTI: treci Neon pe un plan plătit (computul nu mai are plafon de
  # ore), apoi decomentează cele două linii de mai jos. Pe planul gratuit, un cron
  # la 5 minute e incompatibil cu alocația — nu e o chestiune de reglaj fin.
  #
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {}

# O singură rulare odată. Fără asta, o rulare întârziată s-ar suprapune cu
# următoarea și amândouă ar sincroniza aceleași conturi în paralel.
concurrency:
  group: exchange-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # O reîncercare înainte de a raporta eșec. Un cold start sau un hop de rețea
      # nu merită un email de „workflow failed" la fiecare cinci minute — iar un
      # workflow care țipă degeaba e un workflow pe care îl oprești, și atunci
      # rămâi fără sincronizare fără să-ți dai seama.
      - name: Apelează endpoint-ul de sincronizare
        run: |
          call() {
            curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 120 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://www.tradegx.com/api/cron/exchange-sync"
          }
          code=$(call)
          # Pe 401 nu are rost să reîncerci: secretul nu se repară singur în 15
          # secunde. Reîncercarea e doar pentru hopuri tranzitorii (5xx, timeout).
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "Prima încercare: $code — reîncerc peste 15s"
            sleep 15
            code=$(call)
          fi
          cat /tmp/resp.json
          echo ""
          if [ "$code" = "401" ]; then
            echo ""
            echo "═══ CONFIGURARE, nu o eroare tranzitorie ═══"
            echo "Secretul CRON_SECRET din GitHub nu corespunde celui din Vercel."
            echo "Vezi câmpul \"reason\" din răspunsul de mai sus, apoi aliniază"
            echo "valoarea în Vercel → Settings → Environment Variables și"
            echo "redeployează. Reîncercarea nu ajută, deci nu am reîncercat."
            echo ""
            echo "Jobul se încheie CU SUCCES intenționat, ca să nu primești un"
            echo "email la fiecare cinci minute pentru aceeași problemă de"
            echo "configurare. Exact zgomotul ăsta a dus la oprirea workflow-ului"
            echo "de alerte, iar odată cu el s-au stins și alertele."
            echo "Avertismentul apare în aplicație, în pagina Conturi, atâta timp"
            echo "cât sincronizarea automată nu rulează — acolo unde te uiți oricum."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Endpoint a răspuns cu $code"
            exit 1
          fi
