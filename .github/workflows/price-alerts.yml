name: Price alerts cron

# Verifică pragurile de preț de pe watchlist la ~10 minute.
# Necesită secretul CRON_SECRET în GitHub (Settings → Secrets → Actions),
# cu ACEEAȘI valoare ca variabila CRON_SECRET de pe Vercel.

on:
  # ── PROGRAMAREA S-A MUTAT ÎN BAZA DE DATE ───────────────────────────────────
  #
  # Alertele de preț sunt acum declanșate de `pg_cron` din Supabase, prin `pg_net`.
  # Motivul e măsurat, nu teoretic: acest workflow cerea rulări la 5 minute, iar
  # GitHub livra la 47 de minute până la 16 ore. O alertă de preț care ajunge
  # după 16 ore e mai rea decât una lipsă — pare că funcția merge.
  #
  # pg_cron respectă intervalul la secundă, rulează în baza pe care o avem oricum,
  # și nu costă nimic în plus. Joburile se văd cu:
  #   select * from cron.job;
  #   select * from cron.job_run_details order by start_time desc;
  #
  # Declanșarea manuală rămâne, ca plasă de siguranță dacă baza e indisponibilă.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Apelează endpoint-ul de alerte preț
        run: |
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.tradegx.com/api/cron/price-alerts")
          cat /tmp/resp.json
          echo ""
          if [ "$code" != "200" ]; then
            echo "Endpoint a răspuns cu $code"
            exit 1
          fi
